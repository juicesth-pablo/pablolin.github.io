<!DOCTYPE html>
<!-- ===================================================================
     作品內頁範本 —— 複製這份、改掉所有【】標記處即可
     內建：分割式 hero、影片延後載入、漸層、RWD、深色主題選項
     資產命名慣例：images/【專案slug】/、videos/【專案slug】/
==================================================================== -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 【瀏覽器分頁標題】 -->
<title>【專案標題】 · Pablo Lin</title>
<!-- 本頁在 /work，css/js 用 ../ 回上一層 -->
<link rel="stylesheet" href="../style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23929910'/></svg>">
</head>

<!-- 深色主題頁：把下行改成 <body class="theme-dark">；淺色頁維持 <body> -->
<body>

<nav>
  <a href="../index.html" class="mark">Pablo Lin</a>
</nav>

<!-- ===== HERO：固定 banner 背景 + 右側直式影片 + 左側文字 ===== -->
<section class="cw-hero cw-hero--split">

  <!-- 背景 banner（滿版、底部自動漸層淡出）
       構圖提醒：左下角留乾淨，文字才好讀 -->
  <div class="cw-hero-media">
    <img src="../images/【專案slug】/【專案slug】-banner.webp" alt="">
  </div>

  <!-- 右側直式影片（延後載入：先顯示 poster，頁面就緒後才串流）
       ★ 無影片的頁面：把整個 <video> 刪掉即可，其餘不用動 -->
  <video class="cw-hero-video"
    muted loop playsinline
    preload="none"
    poster="../images/【專案slug】/【專案slug】-still.webp"
    data-src="../videos/【專案slug】/【專案slug】-hero-video.mp4"></video>

  <!-- 左側文字容器 -->
  <div class="cw-hero-caption">
    <a href="../index.html#work" class="backlink">← Back to Work</a>
    <div class="case-tags">【分類 · 年份，例：Reels · Influencer &amp; KOL · 2026】</div>
    <h1 class="cw-title oneline">【專案標題】</h1>

    <!-- 成效數字（沒有的話整個 <div class="metrics"> 刪掉）-->
    <div class="metrics">
      <div class="stat"><div class="num"><em>【+34%】</em></div><div class="lbl">【Views growth】</div></div>
      <div class="stat"><div class="num"><em>【62K】</em></div><div class="lbl">【Peak reach】</div></div>
      <div class="stat"><div class="num"><em>【+36%】</em></div><div class="lbl">【Engagement lift】</div></div>
    </div>
  </div>
</section>

<!-- ===== 內文區塊：每個 .case-body 是一段（左小標、右內容）=====
     需要幾段就複製幾個 .case-body；第一段以後上下分隔線會自動對稱 -->
<div class="wrap">
  <div class="case-body reveal">
    <h3>Overview</h3>
    <div>
      <p>【第一段內文。段落間換行用 <br><br>。需要粗體用 <strong>重點</strong>。】</p>
    </div>
  </div>

  <!-- 需要更多段就複製這一塊，改標題與內文
  <div class="case-body reveal">
    <h3>【小標，例：Approach】</h3>
    <div>
      <p>【內文】</p>
    </div>
  </div>
  -->
</div>

<!-- ===== 圖庫（可選，不需要就整段刪掉）=====
     預設 3 欄、4:5 直式圖。
     想要 1:1 方形圖 → 把 class 改成 "gallery gallery-square reveal" -->
<div class="wrap">
  <div class="gallery reveal">
    <div class="shot"><img src="../images/【專案slug】/【專案slug】-1.webp" alt="【專案標題】 — 1" loading="lazy" decoding="async"></div>
    <div class="shot"><img src="../images/【專案slug】/【專案slug】-2.webp" alt="【專案標題】 — 2" loading="lazy" decoding="async"></div>
    <div class="shot"><img src="../images/【專案slug】/【專案slug】-3.webp" alt="【專案標題】 — 3" loading="lazy" decoding="async"></div>
  </div>
</div>

<!-- ===== 下一個專案：連到下一頁 ===== -->
<div class="next-proj">
  <div class="wrap">
    <div class="pre">Next Project</div>
    <a href="【下一頁檔名.html】">【下一個專案標題】 →</a>
  </div>
</div>

<footer>
  <span>© 2026 Pablo Lin</span>
  <span>Taipei, Taiwan</span>
  <span>Built &amp; hosted on GitHub Pages</span>
</footer>

<script src="../app.js"></script>
</body>
</html>
